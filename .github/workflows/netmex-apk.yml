name: Build Netmex APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: netmex-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Android Full Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Configure CI build
        shell: bash
        run: |
          # API 36 is available on hosted runners and is sufficient for this source tree.
          sed -i 's/android-compileSdk = "37"/android-compileSdk = "36"/' gradle/libs.versions.toml
          touch local.properties
          chmod +x gradlew

      - name: Build Netmex Full Debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dkotlin.daemon.jvm.options=-Xmx4g
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p artifacts
          find androidApp/build/outputs/apk/full/debug -maxdepth 1 -type f -name '*.apk' -print -exec cp {} artifacts/Netmex-Full-Debug.apk \;
          test -s artifacts/Netmex-Full-Debug.apk
          sha256sum artifacts/Netmex-Full-Debug.apk | tee artifacts/Netmex-Full-Debug.apk.sha256

      - name: Upload Netmex APK
        uses: actions/upload-artifact@v4
        with:
          name: Netmex-Full-Debug-APK
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
